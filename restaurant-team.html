@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1713;--card:#2a231c;--ink:#f3e9dc;--mut:#b5a493;--line:#4a3e32;--acc:#e8875f;--floor:#2e251d;--tile:#382d23;

--z1:#4a3020;--z2:#3d2f48;--z3:#27384d;--z4:#4d4220;--z5:#2a4430;--z6:#4d2c36;--z7:#244242;--z8:#4d3820;--tbl:#4a3e32;--wood:#7a5a3a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;padding:18px 10px 40px}
.wrap{max-width:1000px;margin:0 auto}
h1{font-size:clamp(24px,5vw,38px);margin:0 0 4px;text-align:center}
.sub{text-align:center;color:var(--mut);margin:0 0 14px;font:14px system-ui,sans-serif}
.scene{position:relative;width:100%;aspect-ratio:1000/640;border-radius:16px;overflow:hidden;border:3px solid var(--ink);background:var(--floor)}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.z{stroke:var(--ink);stroke-width:2;stroke-opacity:.35}
.lbl{font:bold 14px system-ui,sans-serif;fill:var(--ink);opacity:.75}
.tb{fill:var(--tbl);stroke:var(--ink);stroke-width:2;stroke-opacity:.5}
.ch{fill:var(--wood)}
.tok{position:absolute;transform:translate(-50%,-50%);background:none;border:0;cursor:pointer;text-align:center;color:var(--ink);font:inherit;padding:2px;border-radius:12px;width:clamp(56px,11vw,110px);animation:bob 3s ease-in-out infinite}
.tok:nth-child(odd){animation-delay:-1.4s}
@keyframes bob{50%{margin-top:-4px}}
@media (prefers-reduced-motion:reduce){.tok{animation:none}}
.tok:hover,.tok.on{background:rgba(181,83,44,.25)}
.av{width:clamp(34px,6.4vw,62px);height:clamp(34px,6.4vw,62px);border-radius:50%;margin:0 auto 2px;background:var(--card);border:3px solid var(--acc);display:flex;align-items:center;justify-content:center;font-size:clamp(17px,3.4vw,32px);overflow:hidden;box-shadow:0 3px 6px rgba(0,0,0,.25)}
.av img{width:100%;height:100%;object-fit:cover}
.nm{font-size:clamp(9px,1.5vw,13px);font-weight:bold;background:var(--card);border-radius:8px;padding:0 4px;display:inline-block}
.rl{font:clamp(8px,1.1vw,11px) system-ui,sans-serif;color:var(--ink);display:block;margin-top:1px}
@media(max-width:560px){.rl{display:none}}
#info{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:14px;align-items:center;min-height:90px}
#info .av{width:80px;height:80px;margin:0;flex:none;font-size:36px}
#info h3{margin:0 0 4px}
#info p{margin:0 0 8px;color:var(--mut);font:14px system-ui,sans-serif}
label.up{display:inline-block;cursor:pointer;background:var(--acc);color:#fff;padding:6px 12px;border-radius:8px;font:13px system-ui,sans-serif}
input[type=file]{display:none}
.menu{position:absolute;left:66%;top:29%;transform:translate(-50%,-50%);background:#24323a;color:#f3f3e6;border:3px solid var(--wood);border-radius:8px;padding:5px 10px;cursor:pointer;font:bold clamp(9px,1.7vw,15px) system-ui,sans-serif;box-shadow:0 3px 6px rgba(0,0,0,.3)}.menu:hover{background:#34495a}.mn{margin:0;padding-left:18px;font:14px/1.5 system-ui,sans-serif;color:var(--mut)}.mn b{color:var(--ink)}</style>
</head>
